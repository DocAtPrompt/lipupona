[package]
name = "md2lipupona"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
description = "Converts Markdown (CommonMark, GFM) into lipupona's canonical HTML and reports every loss"
repository = "https://github.com/DocAtPrompt/lipupona"

[dependencies]
lipupona = { path = "../.." }
lipupona-convert = { path = "../common" }
html2lipupona = { path = "../html2lipupona" }
pulldown-cmark = { version = "0.13.4", default-features = false }

[[test]]
name = "suite"
harness = false
