[package]
name = "lipupona-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
description = "The lipupona command: canonical HTML, notation, checks and conversion from Markdown and HTML"
repository = "https://github.com/DocAtPrompt/lipupona"

[[bin]]
name = "lipupona"
path = "src/main.rs"

[dependencies]
lipupona = { path = ".." }
md2lipupona = { path = "../converters/md2lipupona" }
html2lipupona = { path = "../converters/html2lipupona" }
unicode-normalization = "0.1.25"
